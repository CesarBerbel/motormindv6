services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: motormindv6
      POSTGRES_USER: motormind
      POSTGRES_PASSWORD: motormind_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motormind -d motormindv6"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build: ./backend
    command: celery -A config worker -l INFO
    env_file:
      - ./.env
    depends_on:
      - backend
      - redis

  beat:
    build: ./backend
    command: celery -A config beat -l INFO
    env_file:
      - ./.env
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - media_data:/usr/share/nginx/media:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  media_data:
